# Builds the website for a Pull Request
#
# This script will only build the website, without a deploy.
# In this way, this CI script can check if a Pull Request does
# not break the build.
#
# The script 'create_zensical_website.yaml', however,
# builds and deploys the website.
name: Build Zensical website

on:
  # Does not trigger by a regular push: create_zensical_website.yaml does that
  pull_request:
    paths:
      - .github/workflows/build_zensical_website.yaml
      - 'docs/**'
      - zensical.toml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_zensical_website:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: pip install natsort
      - run: python3 scripts/sw_table_md_creator.py -i https://export.uppmax.uu.se/staff/software_table_ci/software_table.json -o docs/software/software-table.md
      - run: zensical build
